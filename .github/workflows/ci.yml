name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-sanity:
    name: Repo sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required docs are present
        run: |
          test -f README.md
          test -f docs/REQUIREMENTS.md

      - name: No merge-conflict markers
        run: |
          if grep -rEl '^(<{7}( |$)|={7}$|>{7}( |$))' --exclude-dir=.git .; then
            echo "::error::Merge conflict markers found in the files listed above"
            exit 1
          fi

      - name: No files over 10 MB
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +10M -print)
          if [ -n "$big" ]; then
            echo "::error::Files over 10 MB:"
            echo "$big"
            exit 1
          fi

  node:
    name: Node.js checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Node project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No package.json — skipping Node checks."
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: npm run lint --if-present

      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        run: npm run typecheck --if-present

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: npm test --if-present

      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: npm run build --if-present

  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Python project
        id: detect
        run: |
          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No pyproject.toml or requirements.txt — skipping Python checks."
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e .; fi

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: |
          pip install pytest
          if ls tests/ >/dev/null 2>&1 || ls test_*.py >/dev/null 2>&1; then
            pytest
          else
            echo "No tests found yet — nothing to run."
          fi
